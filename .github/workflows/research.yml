name: Collect research artifact for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run research:collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: research-snapshot-review-required
          path: data/
